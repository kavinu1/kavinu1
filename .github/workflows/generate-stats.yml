name: Generate GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p generated

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── GitHub Stats Card ─────────────────────────────────────────────
      - name: Generate GitHub Stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: kavinu1
          OUTPUT_DARK: generated/github-stats-dark.svg
          OUTPUT_LIGHT: generated/github-stats-light.svg
        run: python .github/scripts/generate_stats_svg.py

      # ── Top Languages Card ────────────────────────────────────────────
      - name: Generate Top Languages SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: kavinu1
          OUTPUT_DARK: generated/top-langs-dark.svg
          OUTPUT_LIGHT: generated/top-langs-light.svg
          MAX_LANGS: 6
        run: python .github/scripts/generate_langs_svg.py

      - name: List generated files
        run: ls -la generated/

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update github stats"
            git push
          fi
