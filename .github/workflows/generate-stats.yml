name: Generate GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── GitHub Stats Card ──────────────────────────────────────────────
      - name: Generate GitHub Stats (Dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: kavinu1
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          config_output: svg
          filename: generated/github-stats-dark.svg
          config_padding: 6
          extras_css: |
            :root { color-scheme: dark; }
            body { background: #161b22; color: #e6edf3; }

      - name: Generate GitHub Stats (Light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: kavinu1
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          config_output: svg
          filename: generated/github-stats-light.svg
          config_padding: 6

      # ── Top Languages Card ────────────────────────────────────────────
      - name: Generate Top Languages (Dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: kavinu1
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_count: 10
          plugin_languages_indepth: yes
          config_timezone: Asia/Colombo
          config_output: svg
          filename: generated/top-langs-dark.svg
          extras_css: |
            :root { color-scheme: dark; }
            body { background: #161b22; color: #e6edf3; }

      - name: Generate Top Languages (Light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: kavinu1
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_count: 10
          plugin_languages_indepth: yes
          config_timezone: Asia/Colombo
          config_output: svg
          filename: generated/top-langs-light.svg

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --cached --quiet || git commit -m "chore: update github stats"
          git push
