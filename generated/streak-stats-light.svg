<svg xmlns="http://www.w3.org/2000/svg" width="480" height="110">
  <!-- Card -->
  <rect width="480" height="110" rx="8" fill="#fffefe" stroke="#e4e2e2" stroke-width="1"/>

  <!-- Dividers -->
  <line x1="160" y1="15" x2="160" y2="95" stroke="#e0dede" stroke-width="1"/>
  <line x1="320" y1="15" x2="320" y2="95" stroke="#e0dede" stroke-width="1"/>

  <!-- ── LEFT: Total Contributions ── -->
  <text x="80" y="36" text-anchor="middle" font-size="26" font-weight="700"
        fill="#1c1c1c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">607</text>
  <text x="80" y="58" text-anchor="middle" font-size="12" font-weight="600"
        fill="#3d3d3d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Total Contributions</text>
  <text x="80" y="74" text-anchor="middle" font-size="10.5" fill="#767676"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Jun 14, 2025</text>
  <text x="80" y="87" text-anchor="middle" font-size="10.5" fill="#767676"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">- Present</text>

  <!-- ── MIDDLE: Current Streak (ring) ── -->
  <!-- Track ring -->
  <circle cx="240" cy="57" r="36" fill="none" stroke="#e0dede" stroke-width="4"/>
  <!-- Progress ring -->
  <circle cx="240" cy="57" r="36" fill="none"
          stroke="none" stroke-width="4"
          stroke-dasharray="56.55 169.65"
          stroke-linecap="round"
          transform="rotate(-90 240 57)"/>
  <!-- Small flame dot at top of ring -->
  <circle cx="240" cy="21" r="5" fill="none"/>
  <!-- Streak number -->
  <text x="240" y="65" text-anchor="middle" font-size="22" font-weight="700"
        fill="none" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">3</text>
  <!-- Label below ring -->
  <text x="240" y="88" text-anchor="middle" font-size="11.5" font-weight="600"
        fill="none" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Current Streak</text>
  <text x="240" y="101" text-anchor="middle" font-size="10" fill="#767676"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Mar 29 - Mar 31</text>

  <!-- ── RIGHT: Longest Streak ── -->
  <text x="400" y="36" text-anchor="middle" font-size="26" font-weight="700"
        fill="#1c1c1c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">12</text>
  <text x="400" y="58" text-anchor="middle" font-size="12" font-weight="600"
        fill="#3d3d3d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Longest Streak</text>
  <text x="400" y="74" text-anchor="middle" font-size="10.5" fill="#767676"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Jul 7 - Jul 18</text>
</svg>
