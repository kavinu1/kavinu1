<svg xmlns="http://www.w3.org/2000/svg" width="495" height="120">
  <!-- Card -->
  <rect width="495" height="120" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Dividers -->
  <line x1="165" y1="20" x2="165" y2="100" stroke="#2d2d2d" stroke-width="1"/>
  <line x1="330" y1="20" x2="330" y2="100" stroke="#2d2d2d" stroke-width="1"/>

  <!-- ── LEFT: Total Contributions ── -->
  <text x="82" y="42" text-anchor="middle" font-size="28" font-weight="700"
        fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">667</text>
  <text x="82" y="65" text-anchor="middle" font-size="13" font-weight="600"
        fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Total Contributions</text>
  <text x="82" y="84" text-anchor="middle" font-size="11" fill="#8b949e"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Jun 14, 2025</text>
  <text x="82" y="98" text-anchor="middle" font-size="11" fill="#8b949e"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">- Present</text>

  <!-- ── MIDDLE: Current Streak (ring) ── -->
  <!-- Track ring -->
  <circle cx="247" cy="65" r="36" fill="none" stroke="#2d2d2d" stroke-width="4"/>
  <!-- Progress ring -->
  <circle cx="247" cy="65" r="36" fill="none"
          stroke="#f0883e" stroke-width="4"
          stroke-dasharray="0.00 226.19"
          stroke-linecap="round"
          transform="rotate(-90 247 65)"/>
  <!-- Small flame dot at top of ring -->
  <circle cx="247" cy="29" r="5" fill="#f0883e"/>
  <!-- Streak number -->
  <text x="247" y="75" text-anchor="middle" font-size="24" font-weight="700"
        fill="#f0883e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">0</text>
  <!-- Label below ring -->
  <text x="247" y="96" text-anchor="middle" font-size="12" font-weight="600"
        fill="#f0883e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Current Streak</text>
  <text x="247" y="111" text-anchor="middle" font-size="11" fill="#8b949e"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Jun 22 - Jun 22</text>

  <!-- ── RIGHT: Longest Streak ── -->
  <text x="412" y="42" text-anchor="middle" font-size="28" font-weight="700"
        fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">12</text>
  <text x="412" y="65" text-anchor="middle" font-size="13" font-weight="600"
        fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Longest Streak</text>
  <text x="412" y="84" text-anchor="middle" font-size="11" fill="#8b949e"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Jul 7 - Jul 18</text>
</svg>
